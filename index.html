</style></head><body><main class="wrap"><div class="notice"><strong>안내</strong> · 서버의 설문 정보를 확인 중입니다.</div><div id="app"></div><footer>2026. 김해영재교육원 영재교육 만족도 조사<br><span id="version-label"></span></footer></main><script>
'use strict';
// 버전 문구는 이 한 곳에서 수정합니다.
const APP_VERSION = 'v1.0 (운영 서버 연결)';
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyOei-z_YJ4T46Iju5a4IL-xY_J2ZKnCrzxluzVoZsHFofb36hq2jJJTDgO0edo5YRv/exec';
let serverReady=false, codeRequired=false, surveyCode='', currentVersion='', currentMode='';
let sending=false, requestId='', payloadSignature='';
async function requestJSON(options={}) {
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),30000);
 try {
  const response=await fetch(WEB_APP_URL,{mode:'cors',credentials:'omit',redirect:'follow',cache:'no-store',...options,signal:controller.signal});
  if(!response.ok || response.type==='opaque')throw Error('서버 응답을 읽을 수 없습니다.');
  return await response.json();
 } finally { clearTimeout(timer); }
}
function validateConfig(data) {
 if(data.ok!==true)throw Error('서버 설정을 확인할 수 없습니다.');
 if(data.status!=='진행')throw Error('현재 설문 기간이 아니거나 설문이 종료되었습니다.');
 const roster=data.classes;
 if(!roster || Object.keys(roster).length!==17 || Object.values(roster).some(a=>!Array.isArray(a)||a.length!==4||a.some(n=>typeof n!=='string'||!n.trim())||new Set(a).size!==4))throw Error('교육반·강사 설정을 확인해 주세요.');
 for(const [type,count] of [['학생',5],['학부모',10]])if(!Array.isArray(data.questions?.[type])||data.questions[type].length!==count||data.questions[type].some(q=>typeof q!=='string'||!q.trim()))throw Error('문항 설정을 확인해 주세요.');
 if(typeof data.version!=='string'||!data.version||typeof data.codeRequired!=='boolean'||!['실제','테스트'].includes(data.mode))throw Error('운영 설정을 확인해 주세요.');
 return data;
}
async function loadPublicConfig() {
 serverReady=false;
 app.innerHTML='<div class="card"><h2>설문 정보를 확인하고 있습니다</h2></div>';
 try {
  const data=validateConfig(await requestJSON());
  classes=data.classes;student=data.questions.학생;parent=data.questions.학부모;
  codeRequired=data.codeRequired;currentVersion=data.version;currentMode=data.mode;serverReady=true;
  document.querySelector('.wrap > .notice').textContent=currentMode==='테스트'?'테스트 운영 중입니다. 실제 응답을 입력하지 마세요.':'이름이나 연락처 등 개인정보를 작성하지 마세요.';
  render();
 } catch(e) {
  app.innerHTML='<div class="card"><h2>현재 설문을 이용할 수 없습니다</h2><p role="alert">'+esc(e.message)+'</p><p>네트워크·브라우저 연결 문제일 수도 있습니다. 잠시 후 새로고침하거나 관리자에게 문의해 주세요.</p></div>';
 }
}
async function submitSurvey() {
 if(sending)return;
 if(!serverReady){render('서버 설정을 확인할 수 없습니다. 새로고침해 주세요.');return}
 if(codeRequired&&!/^[A-Za-z0-9]{8,40}$/.test(surveyCode)){render('참여코드를 확인해 주세요.');return}
 const valid=a=>Array.isArray(a)&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=5);
 if(!['학생','학부모'].includes(state.type)||!Object.hasOwn(classes,state.className)||
   (state.type==='학생'?(!state.agree||state.answers.length!==4||state.answers.some(a=>a.length!==5||!valid(a))||state.comments.some(c=>typeof c!=='string'||c.length>1000)):state.parent.length!==10||!valid(state.parent))){render('필수 응답을 확인해 주세요.');return}
 const payload={type:state.type,className:state.className,code:surveyCode,version:currentVersion};
 if(state.type==='학생')payload.teachers=classes[state.className].map((name,i)=>({name,scores:state.answers[i],comment:state.comments[i]}));else payload.scores=state.parent;
 const signature=JSON.stringify(payload);
 if(requestId&&signature!==payloadSignature){render('이전 제출의 저장 결과가 확인되지 않았습니다. 응답을 원래대로 되돌려 다시 제출하거나 관리자에게 문의해 주세요. 확인 전에는 새로고침하지 마세요.');return}
 sending=true;
 app.querySelectorAll('button,input,textarea').forEach(el=>el.disabled=true);
 try {
  const config=validateConfig(await requestJSON());
  if(config.version!==currentVersion||config.mode!==currentMode||config.codeRequired!==codeRequired)throw Error('설문 설정이 변경되었습니다. 관리자에게 문의하거나 새로고침 후 다시 참여해 주세요.');
  if(!requestId){requestId=crypto.randomUUID();payloadSignature=signature;}
  payload.id=requestId;
  const result=await requestJSON({method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if(result.ok!==true){
   const correctable=['참여코드를 확인해 주세요.','응답을 확인해 주세요.','강사 응답이 올바르지 않습니다.'];
   if(correctable.includes(result.error)){requestId='';payloadSignature='';}
   throw Error(typeof result.error==='string'?result.error:'서버가 저장 성공을 확인하지 않았습니다.');
  }
  state.view='done';render();
 } catch(e) {
  render(esc(e.message)+' 저장 성공이 확인되지 않아 완료 처리하지 않았습니다. '+(requestId?'동일한 응답으로 다시 제출하면 같은 제출 ID를 사용합니다. 확인 전에는 새로고침하거나 창을 닫지 마세요. 제출 ID: '+esc(requestId):'운영 상태와 연결을 확인한 뒤 다시 시도해 주세요.'));
 } finally {sending=false;renderAfterSending();}
}
function renderAfterSending(){app.querySelectorAll('button,input,textarea').forEach(el=>el.disabled=false);}

document.getElementById('version-label').textContent = APP_VERSION;
